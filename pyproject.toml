[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsandbox"
version = "0.1.0"
description = "Ephemeral agent sandbox with WireGuard interception and secrets brokering"
requires-python = ">=3.11"
dependencies = [
    "mitmproxy>=12.0",
    # [crt] pulls in awscrt: aws_profile's SSO/IAM-Identity-Center login flow
    # needs it for the OIDC device-code exchange, and botocore's base install
    # doesn't bundle it - without it, resolving a modern SSO profile fails
    # with "Missing Dependency: ... requires botocore[crt]" instead of a
    # working credential.
    "botocore[crt]>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
asbx = "agentsandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
